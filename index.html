<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-size: 18px;
            font-weight: 400;
            color: #fff;
            list-style-type: none;
            text-decoration: none;
            box-sizing: border-box;
            /* 在计算内容尺寸时，将内边框包含在内 */
            font-family: "微软雅黑";
            line-height: 60px;
            /* 设置内容行高，可用于文字垂直居中 */
        }
        body{
            background-image: url(./nybanner001.png);
            background-size: cover;
            background-repeat: no-repeat;
        }
        .yijihezi{
            width: 520px;
            height: 60px;
            margin: 54px 0 0 130px;
        }
        .yijiliebiao{
            width: 520px;
            height: 60px;
        }
        .yijiliebiao>li{
            float: left;
            width: 120px;
            height: 60px;
            position: relative;
        }
        li{
            display: flex;
            justify-content: center;
        }
        .erjihezi{
            position: absolute;
            top:60px;
            background-color: rgb(255 255 255 / 0.8);
            padding: 0;
            height: 0;
            overflow: hidden;
            transition: all 300ms linear;
        }
        .xuexiaogaikuang,.jigoushezhi{
            margin-right: 70px;
        }
        .erjihezi a{
            color: black;
            font-size: 16px;
            line-height: 40px;
        }
        .erjiliebiao>li{
            width: 120px;
            height: 40px;
        }
        .yijiliebiao>li:hover .erjihezi{
            height: 100px;
            padding: 10px 0;
        }
        .yijiliebiao>li>a::after{
            content: '';
            /* 为当前元素添加一个伪元素，
            after添加在后面，before添加在前面，content必须要写.
            添加伪元素是为了简化代码， */
            position:absolute;
            left: 0;
            width: 120px;
            height: 0;
            background-color: #bb1313;
            z-index: -1;
             transition: all 300ms linear;
        }
        .yijiliebiao>li:hover a::after{
            height: 60px;
        }
    </style>
</head>

<body>
    <div class="yijihezi">
        <ul class="yijiliebiao">
            <li class="xuexiaogaikuang">
                <a href="#">学校概况</a>
            </li>
            <li class="jigoushezhi">
                <a href="#">机构设置</a>
                <div class="erjihezi">
                    <ul class="erjiliebiao">
                        <li>
                            <a href="#">教学科研机构</a>
                        </li>
                        <li>
                            <a href="#">职能部门</a>
                        </li>
                    </ul>
                </div>
            </li>
            <li>
                <a href="#">教育教学</a>
            </li>
        </ul>
    </div>
</body> 

</html>
